
spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: homestay-booking

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lvtn?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

gemini:
  api:
    key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  chatbot:
    api:
      key: ${GEMINI_CHATBOT_API_KEY:${GEMINI_API_KEY:}}
    model: ${GEMINI_CHATBOT_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}
  review:
    api:
      key: ${GEMINI_REVIEW_API_KEY:${GEMINI_API_KEY:}}
    model: ${GEMINI_REVIEW_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}
  embedding:
    api:
      key: ${GEMINI_EMBEDDING_API_KEY:${GEMINI_API_KEY:}}
    model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:}
  ipn-url: ${VNPAY_IPN_URL:}
  frontend-result-url: ${FRONTEND_PAYMENT_RESULT_URL:http://localhost:5173/payment/result}